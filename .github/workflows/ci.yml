name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows.txt
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in @(".\install.ps1", ".\skills\daily-paper-digest\scripts\schedule_windows.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - run: python skills/daily-paper-digest/scripts/configure.py validate --config config.example.json
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
